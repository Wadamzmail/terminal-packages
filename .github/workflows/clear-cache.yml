name: Delete All Caches

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-caches:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete --all \
            --repo "$GITHUB_REPOSITORY" \
            --confirm 
