name: Build Selected Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build (comma-separated)"
        required: true
        type: string

      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show selected packages
        run: |
          echo "Architecture: ${{ inputs.arch }}"
          echo "Packages: ${{ inputs.packages }}"

      - name: Cache built packages
        uses: actions/cache@v4
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ inputs.arch }}
          key: termux-build-${{ inputs.arch }}-${{ hashFiles('packages/**') }}
          restore-keys: |
            termux-build-${{ inputs.arch }}-
          save-always: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          if [ ! -d /github/home/lib/android-ndk-r29 ]; then
            curl -L \
              "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
              -o /tmp/ndk.zip

            unzip -q \
              /tmp/ndk.zip \
              -d /github/home/lib/
          else
            echo "NDK cached"
          fi

      - name: Build selected packages
        run: |
          export ANDROID_NDK_HOME=/github/home/lib/android-ndk-r29
          export NDK=/github/home/lib/android-ndk-r29

          mkdir -p output/${{ inputs.arch }}

          bash -x buildv2.sh \
            -a "${{ inputs.arch }}" \
            -r "https://packages-cf.termux.dev/apt/termux-main" \
            -s packages/termux-keyring/termux.gpg \
            "${{ inputs.packages }}"

      - name: Show build output
        if: always()
        run: |
          echo "=== Generated packages ==="

          find output/${{ inputs.arch }} \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          echo
          echo "=== Build log ==="

          cat output/${{ inputs.arch }}/build.log || true

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    env:
      GPG_KEY_ID: B740141714937F5987E2F56AD90D5C7DEC721765

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}

      - name: Checkout pages branch
        run: |
          git clone \
            --branch pages \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare repository packages
        run: |
          set -e

          ARCH="${{ inputs.arch }}"

          mkdir -p output/all-debs

          echo "Collecting existing packages..."

          find pages \
            -type f \
            -name "*.deb" \
            -exec cp -f {} output/all-debs/ \;

          echo "Adding newly built packages..."

          find "output/${ARCH}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp -f {} output/all-debs/ \;

          echo
          echo "=== All repository packages ==="

          find output/all-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Install repository tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gnupg \
            wget \
            curl

      - name: Download termux-apt-repo
        run: |
          wget \
            https://github.com/termux/termux-apt-repo/raw/refs/heads/master/termux-apt-repo \
            -O termux-apt-repo

          chmod +x termux-apt-repo

      - name: Generate APT repository
        run: |
          set -e

          rm -rf output/repo

          mkdir -p output/repo

          ./termux-apt-repo \
            output/all-debs \
            output/repo \
            stable \
            main

      - name: Import GPG key
        run: |
          echo "${{ secrets.PACKAGES_GPG_KEY }}" |
            base64 -d |
            gpg --batch --import

      - name: Sign repository
        run: |
          set -e

          echo "${{ secrets.PACKAGES_GPG_KEY_PASS }}" |
            gpg \
              --batch \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release

      - name: Deploy to pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false
