name: Build Selected Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build (comma-separated)"
        required: true
        type: string

      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm

permissions:
  contents: write

concurrency:
  group: package-build-${{ inputs.arch }}
  cancel-in-progress: false

jobs:

  build:
    name: Build Packages
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show build configuration
        run: |
          echo "========================================"
          echo "Architecture : ${{ inputs.arch }}"
          echo "Packages     : ${{ inputs.packages }}"
          echo "========================================"

      - name: Cache build environment
        uses: actions/cache@v4
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ inputs.arch }}
          key: termux-build-${{ inputs.arch }}-${{ hashFiles('packages/**') }}
          restore-keys: |
            termux-build-${{ inputs.arch }}-
          save-always: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          if [ ! -d /github/home/lib/android-ndk-r29 ]; then
            echo "Downloading Android NDK r29..."

            curl -L \
              "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
              -o /tmp/ndk.zip

            unzip -q \
              /tmp/ndk.zip \
              -d /github/home/lib/

            rm -f /tmp/ndk.zip
          else
            echo "Android NDK r29 already exists."
          fi

      - name: Build selected packages
        run: |
          set -e

          export ANDROID_NDK_HOME=/github/home/lib/android-ndk-r29
          export NDK=/github/home/lib/android-ndk-r29

          mkdir -p "output/${{ inputs.arch }}"

          bash -x buildv2.sh \
            -a "${{ inputs.arch }}" \
            "${{ inputs.packages }}"

      - name: Show build result
        if: always()
        run: |
          echo "========================================"
          echo "Generated packages"
          echo "========================================"

          find "output/${{ inputs.arch }}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort || true

          echo
          echo "========================================"
          echo "Build log"
          echo "========================================"

          cat "output/${{ inputs.arch }}/build.log" || true

      # GitHub Artifact does not allow ':' in filenames.
      # Replace ':' with COLON before uploading.
      - name: Prepare packages for artifact
        run: |
          set -e

          ARCH="${{ inputs.arch }}"
          DIR="output/${ARCH}"

          cd "$DIR"

          echo "Preparing package filenames..."

          for f in *.deb; do
            [ -f "$f" ] || continue

            newname=$(echo "$f" | tr ':' 'COLON')

            if [ "$f" != "$newname" ]; then
              echo "Renaming:"
              echo "  $f"
              echo "  -> $newname"

              mv "$f" "$newname"
            fi
          done

          echo
          echo "Final artifact files:"

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}/*.deb
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish Repository
    needs: build
    runs-on: ubuntu-latest

    env:
      GPG_KEY_ID: B740141714937F5987E2F56AD90D5C7DEC721765

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
         git lfs install      

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}

      # Restore ':' that was replaced before uploading the artifact.
      - name: Restore package filenames
        run: |
          set -e

          ARCH="${{ inputs.arch }}"

          cd "output/${ARCH}"

          echo "Restoring package filenames..."

          for f in *COLON*.deb; do
            [ -f "$f" ] || continue

            newname=$(echo "$f" | sed 's/COLON/:/g')

            echo "Restoring:"
            echo "  $f"
            echo "  -> $newname"

            mv "$f" "$newname"
          done

          echo
          echo "Restored packages:"

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Checkout pages branch
        run: |
          set -e

          git clone \
            --branch pages \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install repository tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gnupg \
            dpkg \
            wget \
            curl

      - name: Download termux-apt-repo
        run: |
          set -e

          curl -L \
            "https://github.com/termux/termux-apt-repo/raw/refs/heads/master/termux-apt-repo" \
            -o termux-apt-repo

          chmod +x termux-apt-repo

      - name: Collect existing packages
        run: |
          set -e

          mkdir -p repository-debs

          echo "Collecting existing packages from pages..."

          find pages \
            -type f \
            -name "*.deb" \
            -exec cp -f {} repository-debs/ \;

          echo
          echo "Existing packages:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Remove old versions of selected packages
        run: |
          set -e

          python3 <<'PY'
          import glob
          import os
          import subprocess

          input_packages = "${{ inputs.packages }}"

          selected = []

          for item in input_packages.split(","):
              item = item.strip()

              if item and item not in selected:
                  selected.append(item)

          print("========================================")
          print("Selected packages")
          print("========================================")

          for package in selected:
              print(f"  - {package}")

          print()
          print("========================================")
          print("Removing old versions")
          print("========================================")

          for deb in glob.glob("repository-debs/*.deb"):

              try:
                  package_name = subprocess.check_output(
                      ["dpkg-deb", "-f", deb, "Package"],
                      text=True
                  ).strip()

              except subprocess.CalledProcessError:
                  print(f"WARNING: Unable to read package metadata:")
                  print(f"  {deb}")
                  continue

              if package_name in selected:
                  print(f"Removing old version:")
                  print(f"  {deb}")

                  os.remove(deb)
          PY

          echo
          echo "Remaining packages:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Add newly built packages
        run: |
          set -e

          ARCH="${{ inputs.arch }}"

          echo "Adding newly built packages..."

          find "output/${ARCH}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp -f {} repository-debs/ \;

          echo
          echo "Final package set:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Generate APT repository
        run: |
          set -e

          rm -rf output/repo

          mkdir -p output/repo

          echo "Generating APT repository..."

          ./termux-apt-repo \
            repository-debs \
            output/repo \
            stable \
            main

      - name: Import GPG key
        run: |
          set -e

          echo "${{ secrets.PACKAGES_GPG_KEY }}" |
            base64 -d |
            gpg --batch --import

      - name: Sign repository
        run: |
          set -e

          rm -f \
            output/repo/dists/stable/InRelease \
            output/repo/dists/stable/Release.gpg

          echo "${{ secrets.PACKAGES_GPG_KEY_PASS }}" |
            gpg \
              --batch \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release

      - name: Verify repository
        run: |
          set -e

          echo "========================================"
          echo "Repository structure"
          echo "========================================"

          find output/repo \
            -maxdepth 6 \
            -type f |
            sort

          echo
          echo "========================================"
          echo "Packages"
          echo "========================================"

          find output/repo \
            -type f \
            -name "Packages*" \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              head -100 "$1"
            ' _ {} \;

      - name: Deploy to pages
        run: |
          set -e

          echo "========================================"
          echo "Checkout pages branch"
          echo "========================================"

          rm -rf output/pages

          git clone \
            --branch pages \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output/pages

          cd output/pages

          echo
          echo "========================================"
          echo "Setup Git LFS"
          echo "========================================"

          git lfs install

          echo
          echo "========================================"
          echo "Pages LFS configuration"
          echo "========================================"

          if [ ! -f .gitattributes ]; then
            echo "ERROR: .gitattributes not found in pages branch."
            exit 1
          fi

          cat .gitattributes

          echo
          echo "========================================"
          echo "Replace repository contents"
          echo "========================================"

          # Remove everything from pages except:
          # - .git
          # - .gitattributes
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".gitattributes" \
            -exec rm -rf {} +

          # Copy the newly generated APT repository.
          cp -a ../repo/. .

          echo
          echo "========================================"
          echo "Git LFS tracked files"
          echo "========================================"

          git lfs ls-files

          echo
          echo "========================================"
          echo "Git status before commit"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "Stage files"
          echo "========================================"

          git add .

          echo
          echo "========================================"
          echo "Git LFS files after staging"
          echo "========================================"

          git lfs ls-files

          echo
          echo "========================================"
          echo "Create commit"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update package repository"
          fi

          echo
          echo "========================================"
          echo "Push pages"
          echo "========================================"

          git push --force origin pages

          echo
          echo "========================================"
          echo "Deploy completed"
          echo "========================================"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
