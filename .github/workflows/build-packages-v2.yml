name: Build Selected Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build (comma-separated)"
        required: true
        type: string

      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm

permissions:
  contents: write

concurrency:
  group: package-build-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.packages }} (${{ inputs.arch }})
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show build configuration
        run: |
          echo "========================================"
          echo "Architecture : ${{ inputs.arch }}"
          echo "Packages     : ${{ inputs.packages }}"
          echo "========================================"

      - name: Cache build environment
        uses: actions/cache@v4
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ inputs.arch }}
          key: termux-build-${{ inputs.arch }}-${{ hashFiles('packages/**') }}
          restore-keys: |
            termux-build-${{ inputs.arch }}-
          save-always: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          if [ ! -d /github/home/lib/android-ndk-r29 ]; then
            echo "Downloading Android NDK r29..."

            curl -L \
              "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
              -o /tmp/ndk.zip

            unzip -q \
              /tmp/ndk.zip \
              -d /github/home/lib/

            rm -f /tmp/ndk.zip
          else
            echo "Android NDK r29 already exists."
          fi

      - name: Build selected packages
        run: |
          set -e

          export ANDROID_NDK_HOME=/github/home/lib/android-ndk-r29
          export NDK=/github/home/lib/android-ndk-r29

          mkdir -p "output/${{ inputs.arch }}"

          bash -x buildv2.sh \
            -a "${{ inputs.arch }}" \
            "${{ inputs.packages }}"

      - name: Show build result
        if: always()
        run: |
          echo "========================================"
          echo "Generated packages"
          echo "========================================"

          find "output/${{ inputs.arch }}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort || true

          echo
          echo "========================================"
          echo "Build log"
          echo "========================================"

          cat "output/${{ inputs.arch }}/build.log" || true

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}/*.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Repository
    needs: build
    runs-on: ubuntu-latest

    env:
      GPG_KEY_ID: B740141714937F5987E2F56AD90D5C7DEC721765

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages-${{ inputs.arch }}
          path: output/${{ inputs.arch }}

      - name: Show downloaded packages
        run: |
          echo "========================================"
          echo "Built packages"
          echo "========================================"

          find "output/${{ inputs.arch }}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Checkout pages branch
        run: |
          set -e

          git clone \
            --branch pages \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download termux-apt-repo
        run: |
          set -e

          curl -L \
            "https://github.com/termux/termux-apt-repo/raw/refs/heads/master/termux-apt-repo" \
            -o termux-apt-repo

          chmod +x termux-apt-repo

      - name: Install repository tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gnupg \
            dpkg \
            wget \
            curl

      - name: Collect existing packages
        run: |
          set -e

          mkdir -p repository-debs

          echo "Collecting existing .deb packages from pages..."

          find pages \
            -type f \
            -name "*.deb" \
            -exec cp -f {} repository-debs/ \;

          echo
          echo "Existing packages:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Remove old versions of selected packages
        run: |
          set -e

          ARCH="${{ inputs.arch }}"

          echo "========================================"
          echo "Removing old versions"
          echo "========================================"

          python3 <<'PY'
          import glob
          import os
          import subprocess

          input_packages = "${{ inputs.packages }}"

          selected = []
          for item in input_packages.split(","):
              item = item.strip()
              if item and item not in selected:
                  selected.append(item)

          print("Selected packages:")
          for package in selected:
              print(f"  - {package}")

          debs = glob.glob("repository-debs/*.deb")

          for deb in debs:
              try:
                  package_name = subprocess.check_output(
                      ["dpkg-deb", "-f", deb, "Package"],
                      text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  print(f"WARNING: Unable to read package metadata: {deb}")
                  continue

              if package_name in selected:
                  print(f"Removing old version: {deb}")
                  os.remove(deb)
          PY

          echo
          echo "Remaining repository packages:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Add newly built packages
        run: |
          set -e

          ARCH="${{ inputs.arch }}"

          echo "Adding newly built packages..."

          find "output/${ARCH}" \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp -f {} repository-debs/ \;

          echo
          echo "Repository packages after update:"

          find repository-debs \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -printf '%f\n' |
            sort

      - name: Generate APT repository
        run: |
          set -e

          rm -rf output/repo
          mkdir -p output/repo

          echo "Generating APT repository..."

          ./termux-apt-repo \
            repository-debs \
            output/repo \
            stable \
            main

      - name: Import GPG key
        run: |
          set -e

          echo "${{ secrets.PACKAGES_GPG_KEY }}" |
            base64 -d |
            gpg --batch --import

      - name: Sign repository
        run: |
          set -e

          rm -f \
            output/repo/dists/stable/InRelease \
            output/repo/dists/stable/Release.gpg

          echo "${{ secrets.PACKAGES_GPG_KEY_PASS }}" |
            gpg \
              --batch \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release

      - name: Verify repository
        run: |
          set -e

          echo "========================================"
          echo "Repository structure"
          echo "========================================"

          find output/repo \
            -maxdepth 5 \
            -type f |
            sort

          echo
          echo "========================================"
          echo "Release"
          echo "========================================"

          cat output/repo/dists/stable/Release

      - name: Deploy to pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false
          force_orphan: false
